<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Rechner 1</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; margin: 0; }
    .card { background: #1e1e1e; border: 1px solid #333; padding: 24px; border-radius: 12px; width: 300px; display: flex; flex-direction: column; gap: 12px; }
    input { padding: 10px; background: #2c2c2c; border: 1px solid #444; color: #fff; border-radius: 6px; font-size: 16px; }
    button { padding: 10px; background: #007acc; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
    button:hover { background: #005fa3; }
    #result { font-weight: bold; color: #4da6ff; margin-top: 8px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Einfacher Addierer</h2>
    <input type="number" id="num1" placeholder="Zahl 1">
    <input type="number" id="num2" placeholder="Zahl 2">
    <button onclick="addieren()">Zusammenrechnen</button>
    <div id="result">Ergebnis: -</div>
  </div>

  <script>
    function addieren() {
      let a = parseFloat(document.getElementById('num1').value) || 0;
      let b = parseFloat(document.getElementById('num2').value) || 0;
      document.getElementById('result').innerText = "Ergebnis: " + (a + b);
    }
  </script>

</body>
</html>
